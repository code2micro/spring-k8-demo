# Default values for spring-k8-demo chart

global:
  imagePullPolicy: Never

# ---- PostgreSQL ----
postgres:
  image: postgres:16-alpine
  port: 5432
  storage: 1Gi
  credentials:
    username: appuser
    password: apppassword

# ---- Redpanda (Kafka) ----
redpanda:
  image: docker.redpanda.com/redpandadata/redpanda:latest
  port: 9092
  memory: 512M

# ---- Redis ----
redis:
  image: redis:7-alpine
  port: 6379
  maxMemory: 32mb

# ---- api-gateway ----
apiGateway:
  image: api-gateway:latest
  port: 8080
  replicas: 1
  javaOpts: "-Xmx192m"
  memoryLimit: "384Mi"

# ---- order-service ----
orderService:
  image: order-service:latest
  port: 8081
  replicas: 1
  javaOpts: "-Xmx192m"
  memoryLimit: "384Mi"

# ---- inventory-service ----
inventoryService:
  image: inventory-service:latest
  port: 8080
  replicas: 1
  javaOpts: "-Xmx192m"
  memoryLimit: "384Mi"

# ---- Ingress ----
ingress:
  enabled: true
  host: api.spring-k8.local
