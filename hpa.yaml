apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: spring-k8-demo-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spring-app-spring-k8-demo-chart

  minReplicas: 2
  maxReplicas: 5

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50