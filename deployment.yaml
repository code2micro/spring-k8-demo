apiVersion: apps/v1
kind: Deployment

metadata:
  name: spring-k8-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: spring-k8-demo

  template:
    metadata:
      labels:
        app: spring-k8-demo

    spec:
      containers:
      - name: spring-k8-demo
        image: spring-k8-demo:v2
        imagePullPolicy: Never

        env:
        - name: APP_MESSAGE
          valueFrom:
            configMapKeyRef:
              name: spring-config
              key: APP_MESSAGE

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD

        ports:
        - containerPort: 8080

        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5